<script>
(function () {
  'use strict';

  // ───────────────────────── Estado y utilidades ─────────────────────────
  const S = { ini: null, vista: 'dashboard', token: '' };
  const guardado = {
    get: (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } },
  };
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  S.verProm = guardado.get('ipuc_prom') === '1';
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pesos = (v) => (Number(v) < 0 ? '-$ ' : '$ ') + Math.abs(Math.round(Number(v) || 0)).toLocaleString('es-CO');
  const soloDigitos = (s) => Number(String(s || '').replace(/\D/g, '')) || 0;
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const fechaCorta = (f) => { const p = String(f).split('-'); return p.length < 3 ? f : `${Number(p[2])} ${MESES[Number(p[1]) - 1]} ${p[0]}`; };
  const PALETA = ['#00338D', '#009FDA', '#F0AB00', '#4F74C4', '#7FD0EE', '#F6CC5F', '#8C9BBF', '#1C5AA8'];

  function api(accion, datos) {
    return new Promise((ok, mal) => {
      google.script.run
        .withSuccessHandler((r) => {
          if (r && r.ok) return ok(r.data);
          if (r && r.error === 'SESION_VENCIDA') {
            if (window.MODO === 'agenda') { guardado.set('ipuc_ag', ''); iniciarAgenda('Su sesión terminó. Ingrese de nuevo.'); }
            else { guardado.set('ipuc_t', ''); mostrarLogin('Su sesión terminó. Ingrese de nuevo.'); }
            const e = new Error('Su sesión terminó.'); e.silencioso = true; return mal(e);
          }
          mal(new Error(r ? r.error : 'Sin respuesta del servidor'));
        })
        .withFailureHandler((e) => mal(e instanceof Error ? e : new Error(String(e))))
        .api(accion, datos || {}, S.token);
    });
  }

  const CUENTA = (c) => (S.ini && S.ini.cuentas[c]) || c;
  const puede = (p) => S.ini && S.ini.usuario.permisos.indexOf(p) !== -1;

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    $('#toasts').appendChild(t);
    setTimeout(() => t.remove(), err ? 7000 : 4000);
  }

  async function ocupado(btn, fn) {
    const txt = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = 'Procesando…'; }
    try { return await fn(); }
    catch (e) { if (!e.silencioso) toast(e.message, true); throw e; }
    finally { if (btn) { btn.disabled = false; btn.innerHTML = txt; } }
  }

  // ───────────────────────── Íconos (trazos SVG) ─────────────────────────
  const P = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    in: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><rect x="3" y="17" width="18" height="4" rx="1.5"/>',
    out: '<path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><rect x="3" y="17" width="18" height="4" rx="1.5"/>',
    cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',
    users: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 010 8M22 21c0-3-2-5-4-5.5"/>',
    report: '<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M8 17v-3M12 17v-6M16 17v-2"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    cog: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
    log: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    pdf: '<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M9 15h6"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    wallet: '<path d="M20 7H5a2 2 0 010-4h13v4"/><path d="M3 5v14a2 2 0 002 2h15V7"/><circle cx="16" cy="14" r="1.5"/>',
    heart: '<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/>',
    alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
    swap: '<path d="M7 16V4M3 8l4-4 4 4"/><path d="M17 8v12M21 16l-4 4-4-4"/>',
    phone: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14h3v3H8z"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
    cake: '<path d="M4 21h16v-8a2 2 0 00-2-2H6a2 2 0 00-2 2z"/><path d="M4 16c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1 4 0"/><path d="M12 11V7"/><path d="M12 4.5c.8 0 1.2-.7 1.2-1.3S12 1.5 12 1.5s-1.2 1.1-1.2 1.7.4 1.3 1.2 1.3z"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
    xls: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
  };
  const ico = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n] || ''}</svg>`;

  // ───────────────────────── Navegación ─────────────────────────
  const VISTAS = [
    { id: 'dashboard', t: 'Panel', i: 'home', p: 'dashboard.ver', s: 'General', render: vDashboard },
    { id: 'eventos', t: 'Eventos', i: 'flag', p: 'eventos.ver', render: () => vEventos() },
    { id: 'semana', t: 'Informe semanal', i: 'calendar', p: 'semana.ver', render: () => vSemana() },
    { id: 'ingresos', t: 'Diezmos e ingresos', i: 'in', p: 'movimientos.ver', render: () => vMovimientos('INGRESO') },
    { id: 'gastos', t: 'Gastos', i: 'out', p: 'movimientos.ver', render: () => vMovimientos('EGRESO') },
    { id: 'caja', t: 'Caja diaria', i: 'cash', p: 'movimientos.ver', render: vCaja },
    { id: 'nequi', t: 'Nequi', i: 'phone', p: 'movimientos.ver', render: vNequi },
    { id: 'presupuesto', t: 'Presupuesto', i: 'target', p: 'reportes.ver', render: vPresupuesto },
    { id: 'miembros', t: 'Miembros', i: 'users', p: 'miembros.ver', render: vMiembros },
    { id: 'reportes', t: 'Reportes', i: 'report', p: 'reportes.ver', render: vReportes },
    { id: 'usuarios', t: 'Usuarios y roles', i: 'shield', p: 'usuarios.admin', s: 'Administración', render: vUsuarios },
    { id: 'config', t: 'Configuración', i: 'cog', p: 'config.admin', render: vConfig },
    { id: 'auditoria', t: 'Auditoría', i: 'log', p: 'auditoria.ver', render: vAuditoria },
  ];

  function pintarNav() {
    let html = '';
    VISTAS.filter((v) => puede(v.p)).forEach((v) => {
      if (v.s) html += `<div class="nav-section">${v.s}</div>`;
      html += `<a href="#" data-vista="${v.id}" class="${S.vista === v.id ? 'active' : ''}">${ico(v.i)}<span>${v.t}</span></a>`;
    });
    $('#nav').innerHTML = html;
  }

  function ir(id) {
    const v = VISTAS.find((x) => x.id === id && puede(x.p)) || VISTAS.find((x) => puede(x.p));
    S.vista = v.id;
    pintarNav();
    $('#pageTitle').textContent = v.t;
    $('#pageSubtitle').textContent = '';
    $('#topbarActions').innerHTML = botonExcel();
    $('#view').innerHTML = '<div class="card empty">Cargando…</div>';
    $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open');
    Promise.resolve(v.render()).catch((e) => { $('#view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
  }

  function acciones(html) { $('#topbarActions').innerHTML = botonExcel() + html; }

  // ───────────────────────── Modal ─────────────────────────
  function abrirModal(titulo, html) {
    $('#modalTitle').textContent = titulo;
    $('#modalBody').innerHTML = html;
    $('#modal').hidden = false;
    const f = $('#modalBody input:not([type=hidden]), #modalBody select');
    if (f) setTimeout(() => f.focus(), 30);
    return $('#modalBody');
  }
  const cerrarModal = (forzar) => {
    if ($('#modal').classList.contains('fijo') && forzar !== true) return;
    $('#modal').classList.remove('fijo'); $('#modal').hidden = true; $('#modalBody').innerHTML = '';
  };

  function campo(id, etiqueta, control, clase) {
    return `<div class="field ${clase || ''}"><label for="${id}">${etiqueta}</label>${control}</div>`;
  }
  const opciones = (lista, sel) => lista.map((o) => {
    const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    return `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t)}</option>`;
  }).join('');
  function inputDinero(el) {
    el.addEventListener('input', () => {
      const n = soloDigitos(el.value);
      el.value = n ? n.toLocaleString('es-CO') : '';
    });
  }
  const leerForm = (root) => {
    const o = {};
    $$('[name]', root).forEach((el) => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
    return o;
  };

  // ───────────────────────── Panel ─────────────────────────
  async function vDashboard() {
    $('#pageSubtitle').textContent = 'Resumen de la congregación';
    if (puede('movimientos.crear')) {
      acciones(`<button class="btn ghost" data-act="nuevoEgreso">${ico('out')}<span>Registrar gasto</span></button>
        <button class="btn gold" data-act="nuevoIngreso">${ico('plus')}<span>Registrar ingreso</span></button>`);
    }
    const d = await api('dashboard');
    const k = d.kpis;
    const fh = S.ini.hoy.split('-');
    const nombre = (S.ini.usuario.nombre || '').split(' ')[0];
    const aviso = d.diasSinCerrar.length && puede('caja.cerrar')
      ? `<div class="alert">${ico('alert')}<div><b>Hay ${d.diasSinCerrar.length} día(s) con movimientos sin cierre de caja:</b> ${d.diasSinCerrar.slice(-5).map(fechaCorta).join(', ')}. <a href="#" data-vista="caja">Ir a caja diaria</a></div></div>`
      : '';
    const eventos = d.proximosEventos.length
      ? `<div class="lista-evt">${d.proximosEventos.map((e) => {
        const p = e.fecha.split('-');
        return `<div class="evt"><div class="evt-fecha"><b>${Number(p[2])}</b><small>${MESES[Number(p[1]) - 1]}</small></div>
          <div class="evt-txt"><b>${esc(e.titulo)}</b><span>${esc(e.hora_inicio)} a ${esc(e.hora_fin)}${e.lugar ? ' · ' + esc(e.lugar) : ''}</span></div></div>`;
      }).join('')}</div>`
      : '<div class="empty" style="padding:18px">No hay eventos próximos.</div>';
    const hoyDia = Number(fh[2]);
    const cumple = d.cumpleanos.length
      ? `<div>${d.cumpleanos.map((c) => `<div class="cumple ${c.dia === hoyDia ? 'hoy' : ''}"><span>${esc(c.nombre)}</span><span class="muted">${c.dia} ${MESES[Number(fh[1]) - 1]}${c.dia === hoyDia ? ' · ¡hoy!' : ''}</span></div>`).join('')}</div>`
      : '<div class="empty" style="padding:18px">Nadie cumple años este mes.</div>';
    $('#view').innerHTML = `${aviso}
      <div class="hero">
        <div style="position:relative;z-index:1">
          <h2>Bienvenido${nombre ? ', ' + esc(nombre) : ''}</h2>
          <p>IPUC ${esc(S.ini.config.NOMBRE_CONGREGACION || '')} · ${Number(fh[2])} de ${MESES_L[Number(fh[1]) - 1]} de ${fh[0]}</p>
          <span class="lema">${esc(S.ini.lema)}</span>
        </div>
        <div class="hero-saldo"><small>Saldo disponible</small><b>${pesos(d.saldoCaja + d.saldoNequi)}</b>
          <span>Caja ${pesos(d.saldoCaja)} · Nequi ${pesos(d.saldoNequi)}</span></div>
      </div>
      <div class="grid g-4">
        <div class="card kpi"><div class="ico t-cyan">${ico('in')}</div><div><small>Ingresos del mes</small><b>${pesos(k.ingresosMes)}</b><div class="foot">Hoy ${pesos(k.ingresosHoy)}</div></div></div>
        <div class="card kpi k-azul"><div class="ico t-azul">${ico('heart')}</div><div><small>Diezmos del mes</small><b>${pesos(k.diezmosMes)}</b><div class="foot">Liquidado al pastor ${pesos(k.liquidadoMes || 0)}</div></div></div>
        <div class="card kpi k-dorado"><div class="ico t-dorado">${ico('out')}</div><div><small>Gastos del mes</small><b>${pesos(k.egresosMes)}</b><div class="foot">Hoy ${pesos(k.egresosHoy)} · Caja ${d.cajaHoyCerrada ? 'cerrada' : 'abierta'}</div></div></div>
        <div class="card kpi k-azul"><div class="ico t-azul">${ico('users')}</div><div><small>Miembros activos</small><b>${d.miembros.total}</b><div class="foot">${d.miembros.hermanos} hermanos · ${d.miembros.hermanas} hermanas</div></div></div>
      </div>
      <div class="grid g-21">
        <div class="card"><div class="card-head"><h3>Ingresos y gastos · últimos 6 meses</h3>
          <div class="legend"><span><i style="background:var(--cyan)"></i>Ingresos</span><span><i style="background:var(--dorado)"></i>Gastos</span></div></div>
          ${graficoBarras(d.serie)}</div>
        <div class="card"><div class="card-head"><h3>Gastos del mes por categoría</h3></div>${dona(d.egresosPorCategoria)}</div>
      </div>
      <div class="grid g-3">
        <div class="card"><div class="card-head"><h3>Próximos eventos</h3>${puede('eventos.ver') ? '<a href="#" data-vista="eventos">Ver agenda</a>' : ''}</div>${eventos}</div>
        <div class="card"><div class="card-head"><h3>Cumpleaños de ${MESES_L[Number(fh[1]) - 1]}</h3></div>${cumple}</div>
        <div class="card"><div class="card-head"><h3>Presupuesto ${d.presupuesto.anio}</h3><a href="#" data-vista="presupuesto">Ver detalle</a></div>${resumenPpto(d.presupuesto)}</div>
      </div>
      <div class="grid g-21">
        <div class="card"><div class="card-head"><h3>Últimos movimientos</h3>${puede('movimientos.ver') ? '<a href="#" data-vista="ingresos">Ver todos</a>' : ''}</div>
          ${puede('movimientos.ver') ? tablaMovs(d.ultimos, true) : '<div class="empty">Su rol no incluye el detalle de movimientos.</div>'}</div>
        <div class="card"><div class="card-head"><h3>Ingresos del mes por categoría</h3></div>${barrasH(d.ingresosPorCategoria)}</div>
      </div>`;
  }


  function graficoBarras(serie) {
    const W = 600, H = 240, pad = { l: 56, r: 10, t: 12, b: 28 };
    const max = Math.max(1, ...serie.map((s) => Math.max(s.ingresos, s.egresos)));
    const paso = Math.pow(10, Math.floor(Math.log10(max)));
    const tope = Math.ceil(max / paso) * paso;
    const ih = H - pad.t - pad.b, iw = W - pad.l - pad.r, gw = iw / serie.length, bw = Math.min(26, gw / 3.2);
    const y = (v) => pad.t + ih - (v / tope) * ih;
    const corto = (v) => v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : String(v);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = (tope / 4) * i;
      g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8F2"/><text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#64708A">${corto(v)}</text>`;
    }
    serie.forEach((s, i) => {
      const cx = pad.l + gw * i + gw / 2;
      const m = s.mes.split('-');
      g += `<rect x="${cx - bw - 2}" y="${y(s.ingresos)}" width="${bw}" height="${pad.t + ih - y(s.ingresos)}" rx="5" fill="#009FDA"><title>Ingresos ${pesos(s.ingresos)}</title></rect>`;
      g += `<rect x="${cx + 2}" y="${y(s.egresos)}" width="${bw}" height="${pad.t + ih - y(s.egresos)}" rx="5" fill="#F0AB00"><title>Gastos ${pesos(s.egresos)}</title></rect>`;
      g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#64708A">${MESES[Number(m[1]) - 1]}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
  }

  function dona(items) {
    if (!items.length) return '<div class="empty">Sin gastos este mes.</div>';
    const total = items.reduce((a, b) => a + b.valor, 0);
    const top = items.slice(0, 6);
    const resto = items.slice(6).reduce((a, b) => a + b.valor, 0);
    if (resto) top.push({ categoria: 'Otras', valor: resto });
    const R = 54, C = 2 * Math.PI * R;
    let off = 0, arcos = '';
    top.forEach((it, i) => {
      const len = (it.valor / total) * C;
      arcos += `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${PALETA[i % PALETA.length]}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(it.categoria)} ${pesos(it.valor)}</title></circle>`;
      off += len;
    });
    return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140">${arcos}
      <text x="70" y="66" text-anchor="middle" font-size="11" fill="#64708A">Total</text>
      <text x="70" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#00338D">${total >= 1e6 ? (total / 1e6).toFixed(1) + ' M' : Math.round(total / 1e3) + ' mil'}</text></svg>
      <div class="donut-list">${top.map((it, i) => `<div><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PALETA[i % PALETA.length]};margin-right:6px"></i>${esc(it.categoria)}</span><b class="num">${pesos(it.valor)}</b></div>`).join('')}</div></div>`;
  }

  function barraPpto(etiqueta, ejecutado, presupuesto, esperado, gasto) {
    const pct = presupuesto ? Math.round((ejecutado / presupuesto) * 100) : 0;
    const alerta = gasto ? pct > Math.round(esperado * 100) + 10 : false;
    return `<div class="bar-row"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(etiqueta)}</span>
      <b>${pesos(ejecutado)} <span class="muted" style="font-weight:400">de ${pesos(presupuesto)}</span></b></div>
      <div class="track" style="position:relative"><div class="fill" style="width:${Math.min(100, Math.max(presupuesto ? 2 : 0, pct))}%;${alerta ? 'background:var(--dorado)' : ''}"></div>
      ${presupuesto ? `<i title="Esperado a la fecha" style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100, esperado * 100)}%;width:2px;background:var(--azul-900)"></i>` : ''}</div>
      <div class="muted" style="font-size:12px">${presupuesto ? pct + '% ejecutado' + (alerta ? ' · por encima de lo esperado' : '') : 'Sin presupuesto definido'}</div></div>`;
  }

  function resumenPpto(p) {
    if (!p.ingresos.presupuesto && !p.egresos.presupuesto) {

      '<div class="muted" style="font-size:12px">La línea oscura marca lo esperado a la fecha.</div>';
  }

  function barrasH(items) {
    if (!items.length) return '<div class="empty">Sin ingresos este mes.</div>';
    const max = items[0].valor || 1;
    return items.map((it) => `<div class="bar-row"><div style="display:flex;justify-content:space-between"><span>${esc(it.categoria)}</span><b>${pesos(it.valor)}</b></div>

  function descargar(nombre, base64) {
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const xls = /\.xlsx$/i.test(nombre);
    const url = URL.createObjectURL(new Blob([bytes], { type: xls ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = xls || /\.pdf$/i.test(nombre) ? nombre : nombre + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function abrirPdf(accion, datos, btn) {
    let r = await ocupado(btn, () => api(accion, datos));
    if (!r.contenido) r = await ocupado(btn, () => api('descargarPdf', { url: r.url }));
    descargar(r.nombre, r.contenido);
    toast('PDF descargado y guardado en Drive: ' + r.nombre);
  }

  async function verPdf(url, btn) {
    const r = await ocupado(btn, () => api('descargarPdf', { url }));
    descargar(r.nombre, r.contenido);
  }

  async function cargarCierre() {
    const z = $('#cierreZona');
    z.innerHTML = '<div class="card empty">Cargando…</div>';
    const d = await api('previaCierre', { fecha: S.fechaCaja });
    const resumen = `<div class="card"><div class="card-head"><h3>Movimiento de caja · ${fechaCorta(d.fecha)}</h3>${d.cerrado ? `<span class="badge b-ok">${ico('lock').replace('<svg', '<svg width="11" height="11"')} Cerrada</span>` : '<span class="badge b-egr">Abierta</span>'}</div>

        <div><span>Saldo inicial en caja</span><b>${pesos(d.saldoInicialCaja)}</b></div>
        <div><span>(+) Entradas de efectivo</span><b>${pesos(d.ingresosCaja)}</b></div>
        <div><span>(−) Salidas de efectivo</span><b>${pesos(d.egresosCaja)}</b></div>
        <div class="total"><span>Saldo esperado en caja</span><span>${pesos(d.saldoEsperadoCaja)}</span></div>
        <div><span>Saldo en Nequi al cierre</span><b>${pesos(d.saldoNequi)}</b></div>
        <div><span>Movimientos del día</span><b>${d.movimientos.length}</b></div>
      </div></div>`;
    const arqueo = d.cerrado
      ? `<div class="card"><div class="card-head"><h3>Arqueo</h3></div><div class="alert info">${ico('lock')}<div>Este día ya fue cerrado. Consulte el PDF en el historial. ${puede('caja.reabrir') ? 'Un administrador puede reabrirlo si hace falta corregir.' : ''}</div></div></div>`
      : `<div class="card"><div class="card-head"><h3>Arqueo de efectivo</h3><span class="muted">Cuenten entre dos personas</span></div>
        <form id="fArqueo"><div class="denoms">${S.ini.denominaciones.map((v) => `<label class="denom"><span>${v >= 2000 ? 'Billete' : 'Moneda'} ${pesos(v)}</span><input type="number" min="0" step="1" data-den="${v}" placeholder="0"></label>`).join('')}</div>
        <div class="summary" style="margin-top:14px">
          <div><span>Total contado</span><b id="aContado">$ 0</b></div>
          <div class="total"><span>Diferencia</span><span id="aDif">${pesos(-d.saldoEsperadoCaja)}</span></div>
        </div>
        <div class="form" style="margin-top:6px">
          ${campo('aVer', 'Verificó el conteo (segunda persona)', `<input id="aVer" value="${esc(d.verificador || '')}" placeholder="Nombre del diácono o verificador" required>`, 'full')}
          ${campo('aObs', 'Observaciones', '<textarea id="aObs" rows="2" placeholder="Obligatorio si hay diferencia"></textarea>', 'full')}
        </div>
        <div class="form-actions" style="margin-top:12px"><button class="btn gold" type="submit">${ico('lock')} Cerrar caja y generar PDF</button></div></form></div>`;
    z.innerHTML = resumen + arqueo;
    const f = $('#fArqueo');
    if (!f) return;
    const contar = () => {
      let t = 0; const den = {};
      $$('[data-den]', f).forEach((i) => { const n = Math.max(0, Math.floor(Number(i.value) || 0)); if (n) den[i.dataset.den] = n; t += n * Number(i.dataset.den); });
      $('#aContado').textContent = pesos(t);
      const dif = t - d.saldoEsperadoCaja;
      $('#aDif').textContent = pesos(dif);
      $('#aDif').style.color = dif ? 'var(--danger)' : 'var(--ok)';
      return den;
    };
    f.addEventListener('input', contar); contar();
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (!confirm(`¿Cerrar la caja del ${fechaCorta(d.fecha)}? Después no se podrán registrar ni anular movimientos de ese día.`)) return;
      const c = await ocupado(ev.submitter, () => api('cerrarCaja', { fecha: d.fecha, denominaciones: contar(), verificado_por: $('#aVer').value, observaciones: $('#aObs').value }));
      toast(`Caja cerrada (${c.id}). PDF guardado en Drive.`);
      if (c.pdf_url) verPdf(c.pdf_url);
      ir('caja');
    });
  }

          ${campo('nFecha', 'Fecha de corte', `<input type="date" id="nFecha" value="${d.fecha}" max="${S.ini.hoy}">`)}
          <div class="summary"><div><span>Saldo según el sistema</span><b>${pesos(d.saldoSistema)}</b></div></div>
          ${campo('nSaldo', 'Saldo que muestra la app Nequi', '<input id="nSaldo" inputmode="numeric" class="money" placeholder="0" required>')}
          <div class="summary"><div class="total"><span>Diferencia</span><span id="nDif">—</span></div></div>
          ${campo('nObs', 'Observaciones', '<textarea id="nObs" rows="2" placeholder="Obligatorio si hay diferencia"></textarea>')}
          <div class="form-actions"><button class="btn gold" type="submit">${ico('check')} Conciliar y generar PDF</button></div>
        </form></div></div>`;
    $('#nFecha').addEventListener('change', (e) => cargarConciliacion(e.target.value));
    const saldo = $('#nSaldo'); inputDinero(saldo);
    saldo.addEventListener('input', () => {
      const dif = soloDigitos(saldo.value) - d.saldoSistema;
      $('#nDif').textContent = saldo.value ? pesos(dif) : '—';
      $('#nDif').style.color = dif ? 'var(--danger)' : 'var(--ok)';
    });
    $('#marcarTodos').addEventListener('click', () => $$('[data-conc]').forEach((c) => { c.checked = true; }));
    $('#fConc').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const ids = $$('[data-conc]').filter((c) => c.checked).map((c) => c.dataset.conc);
      const c = await ocupado(ev.submitter, () => api('conciliarNequi', { fecha: $('#nFecha').value, saldo_nequi: soloDigitos(saldo.value), ids, observaciones: $('#nObs').value }));
      toast(`Conciliación ${c.id} guardada.`);
      if (c.pdf_url) verPdf(c.pdf_url);
      ir('nequi');
    });
  }

  // ───────────────────────── Presupuesto anual ─────────────────────────
  async function vPresupuesto() {
    $('#pageSubtitle').textContent = 'Presupuesto anual por categoría frente a lo ejecutado';
    const anioActual = Number(S.ini.hoy.slice(0, 4));
    S.anioPpto = S.anioPpto || anioActual;
    const editar = puede('presupuesto.editar');
    if (editar) acciones(`<button class="btn gold" data-act="guardarPpto">${ico('check')}<span>Guardar presupuesto</span></button>`);
    $('#view').innerHTML = `<div class="card"><div class="filters">
        ${campo('pAnio', 'Año', `<select id="pAnio">${opciones([anioActual - 1, anioActual, anioActual + 1], S.anioPpto)}</select>`)}
      </div></div><div id="pptoZona"><div class="card empty">Cargando…</div></div>`;
    $('#pAnio').addEventListener('change', (e) => { S.anioPpto = Number(e.target.value); vPresupuesto(); });
    const p = await api('obtenerPresupuesto', { anio: S.anioPpto });
    S.ppto = p;
    const tabla = (tipo, titulo) => {
      const filas = p.filas.filter((f) => f.tipo === tipo);
      return `<div class="card"><div class="card-head"><h3>${titulo}</h3></div><div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="num">Presupuesto anual</th><th class="num">Ejecutado</th><th style="width:30%">Avance</th></tr></thead><tbody>
        ${filas.map((f) => {
          const pct = f.presupuesto ? Math.round(f.ejecutado * 100 / f.presupuesto) : 0;
          const alto = tipo === 'EGRESO' && f.presupuesto && pct > Math.round(p.fraccionAnio * 100) + 10;
          return `<tr><td>${esc(f.categoria)}</td>
          <td class="num">${editar ? `<input data-ppto="${esc(tipo + '|' + f.categoria)}" inputmode="numeric" value="${f.presupuesto ? f.presupuesto.toLocaleString('es-CO') : ''}" placeholder="0" style="width:140px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px">` : pesos(f.presupuesto)}</td>
          <td class="num">${pesos(f.ejecutado)}</td>
          <td><div class="track" style="height:8px;background:#EDF1F8;border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.min(100, pct)}%;background:${alto ? 'var(--dorado)' : 'var(--cyan)'}"></div></div>
            <span class="muted" style="font-size:12px">${f.presupuesto ? pct + '%' : '—'}</span></td></tr>`;
        }).join('')}</tbody></table></div></div>`;
    };
    $('#pptoZona').innerHTML = `<div class="grid g-2" style="margin-bottom:20px">
        <div class="card">${barraPpto('Ingresos ' + p.anio, p.ingresos.ejecutado, p.ingresos.presupuesto, p.fraccionAnio, false)}</div>
        <div class="card">${barraPpto('Gastos ' + p.anio, p.egresos.ejecutado, p.egresos.presupuesto, p.fraccionAnio, true)}</div></div>
      <div class="grid">${tabla('INGRESO', 'Ingresos')}${tabla('EGRESO', 'Gastos')}</div>`;
    $$('[data-ppto]').forEach(inputDinero);
  }

  async function guardarPpto(btn) {
    const valores = {};
    $$('[data-ppto]').forEach((i) => { valores[i.dataset.ppto] = soloDigitos(i.value); });
    await ocupado(btn, () => api('guardarPresupuesto', { anio: S.anioPpto, valores }));
    toast('Presupuesto guardado.');
    vPresupuesto();
  }

  // ───────────────────────── Miembros ─────────────────────────
  async function vMiembros() {
    $('#pageSubtitle').textContent = 'Directorio de la congregación';
    if (puede('miembros.editar')) acciones(`<button class="btn gold" data-act="nuevoMiembro">${ico('plus')}<span>Nuevo miembro</span></button>`);
    S.miembros = await api('listarMiembros');
    const activos = S.miembros.filter((m) => m.estado === 'Activo');
    const cuenta = (g) => activos.filter((m) => (m.genero || '') === g).length;
    let filtro = '';
    $('#view').innerHTML = `<div class="card"><div class="card-head"><h3>${activos.length} miembro(s) activo(s) · ${cuenta('Masculino')} hermanos · ${cuenta('Femenino')} hermanas</h3>
      <div class="field" style="width:min(320px,100%)"><input id="bMiembro" placeholder="Buscar por nombre o teléfono"></div></div>
      <div class="card-head" style="flex-wrap:wrap;gap:10px">
        <div class="seg" id="segGenero"><button class="on" data-g="">Todos</button><button data-g="Masculino">Hermanos</button><button data-g="Femenino">Hermanas</button></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="mInact"> Incluir inactivos</label>
          <button class="btn ghost sm" id="pdfMiembros">${ico('pdf')}<span>Descargar PDF</span></button></div></div>
      ${cuenta('') ? `<p class="muted" style="margin:0 0 10px">${cuenta('')} miembro(s) activo(s) sin género registrado. Edítelos para que salgan en el reporte correcto.</p>` : ''}
      <div id="tMiembros"></div></div>`;
    const pintar = () => {
      const q = $('#bMiembro').value.toLowerCase().trim();
      const lista = S.miembros.filter((m) => (!filtro || m.genero === filtro) && (!q || `${m.nombre} ${m.telefono}`.toLowerCase().includes(q)));
      $('#tMiembros').innerHTML = lista.length ? `<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Género</th><th>Edad</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Estado</th><th></th></tr></thead><tbody>
        ${lista.map((m) => `<tr><td><b>${esc(m.nombre)}</b></td><td>${esc(m.genero || '—')}</td><td>${edad(m.fecha_nacimiento)}</td><td>${esc(m.telefono || '—')}</td><td>${esc(m.email || '—')}</td><td>${esc(m.direccion || '—')}</td>
          <td><span class="badge ${m.estado === 'Activo' ? 'b-ok' : 'b-egr'}">${esc(m.estado)}</span></td>
          <td>${puede('miembros.editar') ? `<button class="btn ghost sm" data-act="editarMiembro" data-id="${esc(m.id)}">Editar</button>` : ''}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No se encontraron miembros.</div>';
    };
    $('#segGenero').addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      filtro = b.dataset.g;
      document.querySelectorAll('#segGenero button').forEach((x) => x.classList.toggle('on', x === b));
      pintar();
    });
    $('#pdfMiembros').addEventListener('click', (ev) => abrirPdf('pdfMiembros', { genero: filtro, estado: $('#mInact').checked ? 'Todos' : 'Activo' }, ev.currentTarget));
    $('#bMiembro').addEventListener('input', pintar); pintar();
  }

  function edad(nac) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(nac || ''))) return '—';
    const h = S.ini.hoy.split('-').map(Number), n = String(nac).split('-').map(Number);
    return h[0] - n[0] - ((h[1] < n[1] || (h[1] === n[1] && h[2] < n[2])) ? 1 : 0);
  }

  function formMiembro(id) {
    const m = (S.miembros || []).find((x) => x.id === id) || { estado: 'Activo' };
    const body = abrirModal(id ? 'Editar miembro' : 'Nuevo miembro', `<form class="form" id="fMiembro">
      <input type="hidden" name="id" value="${esc(m.id || '')}">
      ${campo('nNom', 'Nombre completo', `<input name="nombre" id="nNom" value="${esc(m.nombre)}" required>`, 'full')}
      ${campo('nGen', 'Género', `<select name="genero" id="nGen" required><option value="">Seleccione…</option>${opciones(['Masculino', 'Femenino'], m.genero)}</select>`)}
      ${campo('nNac', 'Fecha de nacimiento', `<input type="date" name="fecha_nacimiento" id="nNac" value="${esc(m.fecha_nacimiento)}" max="${S.ini.hoy}">`)}
      ${campo('nTel', 'Teléfono (opcional)', `<input name="telefono" id="nTel" inputmode="tel" value="${esc(m.telefono)}">`)}
      ${campo('nEmail', 'Correo (opcional)', `<input type="email" name="email" id="nEmail" value="${esc(m.email)}">`)}
      ${campo('nDir', 'Dirección (opcional)', `<input name="direccion" id="nDir" value="${esc(m.direccion)}">`)}
      ${campo('nEst', 'Estado', `<select name="estado" id="nEst">${opciones(['Activo', 'Inactivo'], m.estado)}</select>`)}
      <div class="form-actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn gold" type="submit">Guardar</button></div></form>`);
    $('#fMiembro', body).addEventListener('submit', async (ev) => {
      ev.preventDefault();
      S.miembros = await ocupado(ev.submitter, () => api('guardarMiembro', leerForm(ev.target)));
      cerrarModal(); toast('Miembro guardado.'); ir('miembros');
    });
  }

  // ───────────────────────── Eventos (agenda sin cruces de horario) ─────────────────────────
  const DIAS_SEM = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const isoFecha = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const puedeEditarEvt = (e) => puede('eventos.gestionar') || String(e.creado_por).toLowerCase() === S.ini.usuario.email;
  const cruce = (fecha, ini, fin, id) => (S.eventos || []).find((e) => e.id !== id && e.fecha === fecha && e.hora_inicio < fin && ini < e.hora_fin);

  async function vEventos() {
    $('#pageSubtitle').textContent = 'Agenda general de la congregación. Dos eventos no pueden cruzarse en el mismo horario.';
    acciones((puede('eventos.gestionar') ? `<button class="btn ghost" data-act="copiarEnlace">${ico('flag')}<span>Enlace para comités</span></button>` : '')
      + (puede('eventos.crear') ? `<button class="btn gold" data-act="nuevoEvento">${ico('plus')}<span>Nuevo evento</span></button>` : ''));
    S.evMes = S.evMes || S.ini.hoy.slice(0, 7);
    S.eventos = await api('listarEventos', {});
    const [y, m] = S.evMes.split('-').map(Number);
    const ant = isoFecha(new Date(y, m - 2, 1)).slice(0, 7), sig = isoFecha(new Date(y, m, 1)).slice(0, 7);
    const primero = new Date(y, m - 1, 1);
    const inicio = new Date(y, m - 1, 1 - ((primero.getDay() + 6) % 7));
    let celdas = DIAS_SEM.map((d) => `<div class="cal-h">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const dt = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
      if (i >= 35 && dt.getMonth() !== m - 1) break;
      const f = isoFecha(dt);
      const fuera = dt.getMonth() !== m - 1, pasado = f < S.ini.hoy;
      const evs = S.eventos.filter((e) => e.fecha === f);
      const crear = !fuera && !pasado && puede('eventos.crear');
      celdas += `<div class="cal-d ${fuera ? 'fuera' : ''} ${pasado && !fuera ? 'pasado' : ''} ${f === S.ini.hoy ? 'hoy' : ''}" ${crear ? `data-act="nuevoEvento" data-fecha="${f}" title="Agendar un evento este día"` : ''}>
        <span class="n">${dt.getDate()}</span>
        ${evs.map((e) => `<span class="cal-e" data-act="verEvento" data-id="${esc(e.id)}" title="${esc(e.hora_inicio + ' ' + e.titulo)}">${esc(e.hora_inicio)} ${esc(e.titulo)}</span>`).join('')}</div>`;
    }
    const proximos = S.eventos.filter((e) => e.fecha >= S.ini.hoy).slice(0, 12);
    $('#view').innerHTML = `<div class="grid g-21">
      <div class="card"><div class="card-head"><div class="sem-head">
          <button class="icon-btn" data-act="mesEvt" data-mes="${ant}" aria-label="Mes anterior">‹</button>
          <h3 style="min-width:150px;text-align:center">${MESES_L[m - 1].replace(/^./, (c) => c.toUpperCase())} ${y}</h3>
          <button class="icon-btn" data-act="mesEvt" data-mes="${sig}" aria-label="Mes siguiente">›</button></div>
          ${S.evMes !== S.ini.hoy.slice(0, 7) ? `<button class="btn ghost sm" data-act="mesEvt" data-mes="${S.ini.hoy.slice(0, 7)}">Hoy</button>` : ''}</div>
        <div class="cal">${celdas}</div>
        <p class="muted" style="margin:10px 0 0;font-size:13px">Toque un día para agendar un evento, o un evento para ver su detalle.</p></div>
      <div class="card" style="align-self:start"><div class="card-head"><h3>Próximos eventos</h3></div>
        ${proximos.length ? `<div class="lista-evt">${proximos.map((e) => {
          const p = e.fecha.split('-');
          return `<div class="evt" data-act="verEvento" data-id="${esc(e.id)}" style="cursor:pointer"><div class="evt-fecha"><b>${Number(p[2])}</b><small>${MESES[Number(p[1]) - 1]}</small></div>
            <div class="evt-txt"><b>${esc(e.titulo)}</b><span>${esc(e.hora_inicio)} a ${esc(e.hora_fin)}${e.lugar ? ' · ' + esc(e.lugar) : ''}${e.comite ? ' · ' + esc(e.comite) : ''}</span></div></div>`;
        }).join('')}</div>` : '<div class="empty">No hay eventos agendados.</div>'}</div>
    </div>`;
  }

  function verEvento(id) {
    const e = (S.eventos || []).find((x) => x.id === id);
    if (!e) return;
    const body = abrirModal(e.titulo, `<div class="summary">
        <div><span class="muted">Fecha</span><b>${fechaCorta(e.fecha)}</b></div>
        <div><span class="muted">Horario</span><b>${esc(e.hora_inicio)} a ${esc(e.hora_fin)}</b></div>
        ${e.lugar ? `<div><span class="muted">Lugar</span><b>${esc(e.lugar)}</b></div>` : ''}
        ${e.responsable ? `<div><span class="muted">Responsable</span><b>${esc(e.responsable)}</b></div>` : ''}
        ${e.comite ? `<div><span class="muted">Comité</span><b>${esc(e.comite)}</b></div>` : ''}
        <div><span class="muted">Agendado por</span><span>${esc(e.creado_por)}${e.origen === 'ENLACE' ? ' (enlace de comités)' : ''}</span></div></div>
      ${e.descripcion ? `<p style="white-space:pre-wrap">${esc(e.descripcion)}</p>` : ''}
      <div class="form-actions" style="margin-top:16px">
        ${puedeEditarEvt(e) ? `<button class="btn danger" id="evCancelar">Cancelar evento</button><button class="btn ghost" id="evEditar">Editar</button>` : ''}
        <button class="btn" data-close>Cerrar</button></div>`);
    if (!puedeEditarEvt(e)) return;
    $('#evEditar', body).addEventListener('click', () => formEvento(e));
    $('#evCancelar', body).addEventListener('click', async (ev) => {
      const motivo = prompt('Motivo de la cancelación:');
      if (!motivo || !motivo.trim()) return;
      await ocupado(ev.currentTarget, () => api('cancelarEvento', { id: e.id, motivo }));
      cerrarModal(); toast('Evento cancelado.'); vEventos();
    });
  }

  async function formEvento(e, fecha) {
    if (!S.eventos) S.eventos = await api('listarEventos', {});
    e = e || { fecha: fecha || S.ini.hoy, hora_inicio: '', hora_fin: '', lugar: 'Templo' };
    const body = abrirModal(e.id ? 'Editar evento' : 'Nuevo evento', `<form class="form" id="fEvento">
      <input type="hidden" name="id" value="${esc(e.id || '')}">
      ${campo('eTit', 'Nombre del evento', `<input name="titulo" id="eTit" value="${esc(e.titulo)}" required placeholder="Ej.: Vigilia de jóvenes">`, 'full')}
      ${campo('eFec', 'Fecha', `<input type="date" name="fecha" id="eFec" value="${esc(e.fecha)}" ${e.id ? '' : `min="${S.ini.hoy}"`} required>`, 'full')}
      ${campo('eIni', 'Hora de inicio', `<input type="time" name="hora_inicio" id="eIni" value="${esc(e.hora_inicio)}" required>`)}
      ${campo('eFin', 'Hora de terminación', `<input type="time" name="hora_fin" id="eFin" value="${esc(e.hora_fin)}" required>`)}
      ${campo('eLug', 'Lugar', `<input name="lugar" id="eLug" value="${esc(e.lugar)}">`)}
      ${campo('eRes', 'Responsable', `<input name="responsable" id="eRes" value="${esc(e.responsable)}">`)}
      ${campo('eDes', 'Descripción (opcional)', `<textarea name="descripcion" id="eDes" rows="2">${esc(e.descripcion)}</textarea>`, 'full')}
      <div class="full" id="eDia"></div>
      <div class="form-actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn gold" type="submit" id="eGuardar">Guardar</button></div></form>`);
    const revisar = () => {
      const f = $('#eFec', body).value, ini = $('#eIni', body).value, fin = $('#eFin', body).value;
      const ese = S.eventos.filter((x) => x.fecha === f && x.id !== e.id);
      const c = f && ini && fin && fin > ini ? cruce(f, ini, fin, e.id) : null;
      const malOrden = ini && fin && fin <= ini;
      $('#eDia', body).innerHTML = (c ? `<div class="alert" style="margin-bottom:8px">${ico('alert')}<div>Se cruza con <b>${esc(c.titulo)}</b> (${esc(c.hora_inicio)} a ${esc(c.hora_fin)}). Elija otra hora o fecha.</div></div>` : '')
        + (malOrden ? `<div class="alert" style="margin-bottom:8px">${ico('alert')}<div>La hora de terminación debe ser posterior a la de inicio.</div></div>` : '')
        + (ese.length ? `<div class="alert info">${ico('calendar')}<div><b>Ya agendado ese día:</b> ${ese.map((x) => `${esc(x.hora_inicio)}–${esc(x.hora_fin)} ${esc(x.titulo)}`).join(' · ')}</div></div>` : '');
      $('#eGuardar', body).disabled = !!c || !!malOrden;
    };
    ['#eFec', '#eIni', '#eFin'].forEach((sel) => $(sel, body).addEventListener('input', revisar));
    revisar();
    $('#fEvento', body).addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const datos = leerForm(ev.target);
      await ocupado(ev.submitter, () => api('guardarEvento', datos));
      cerrarModal(); toast('Evento guardado.');
      S.evMes = datos.fecha.slice(0, 7);
      if (S.vista === 'eventos') vEventos(); else ir('eventos');
    });
  }

  // ───────────────────────── Contraseñas ─────────────────────────
  function formClave(forzado) {
    const body = abrirModal(forzado ? 'Cree su contraseña personal' : 'Cambiar contraseña', `<form class="form" id="fClave">
      ${forzado ? '<div class="full alert info">Está usando una contraseña temporal. Escriba una nueva, de al menos 8 caracteres, que solo usted conozca.</div>' : ''}
      ${campo('kAct', forzado ? 'Contraseña temporal' : 'Contraseña actual', '<input type="password" name="actual" id="kAct" autocomplete="current-password" required>', 'full')}
      ${campo('kNue', 'Contraseña nueva', '<input type="password" name="nueva" id="kNue" minlength="8" autocomplete="new-password" required>')}
      ${campo('kCon', 'Repita la contraseña nueva', '<input type="password" name="confirmar" id="kCon" minlength="8" autocomplete="new-password" required>')}
      <div class="form-actions">${forzado ? '<button type="button" class="btn ghost" data-act="salir">Salir</button>' : '<button type="button" class="btn ghost" data-close>Cancelar</button>'}
        <button class="btn gold" type="submit">Guardar contraseña</button></div></form>`);
    if (forzado) $('#modal').classList.add('fijo');
    $('#fClave', body).addEventListener('submit', async (ev) => {
      ev.preventDefault();
      await ocupado(ev.submitter, () => api('cambiarClave', leerForm(ev.target)));
      cerrarModal(true); toast('Contraseña actualizada.');
      if (forzado) { S.ini.cambiarClave = false; ir('dashboard'); }
    });
  }

  function copiar(texto, msg) {
    const listo = () => toast(msg || 'Copiado.');
    const viejo = () => {
      const t = document.createElement('textarea');
      t.value = texto; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); listo(); } catch (e) { prompt('Copie este texto:', texto); }
      t.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(listo, viejo); else viejo();
  }

  function mostrarClaveTemporal(email, clave) {
    const enlace = String(S.ini.urlAgenda || '').replace(/\?p=agenda$/, '');

  // ───────────────────────── Excel: exportar e importar ─────────────────────────
  // La librería SheetJS se carga solo cuando alguien usa el botón Excel.
  const XLSX_URL = window.XLSX_SRC || 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  let xlsxCarga = null;
  function cargarXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    xlsxCarga = xlsxCarga || new Promise((ok, mal) => {
      const sc = document.createElement('script');
      sc.src = XLSX_URL;
      sc.onload = () => ok(window.XLSX);
      sc.onerror = () => { xlsxCarga = null; mal(new Error('No se pudo cargar el módulo de Excel. Revise la conexión a internet e intente de nuevo.')); };
      document.head.appendChild(sc);
    });
    return xlsxCarga;
  }

  // Fechas aaaa-mm-dd se guardan como fecha real de Excel; los números con separador de miles.
  const serialExcel = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000 + 25569; };
  async function bajarExcel(nombre, hojas) {
    const X = await cargarXlsx();
    const wb = X.utils.book_new();
    const usados = {};
    hojas.forEach((h) => {
      const ws = X.utils.aoa_to_sheet(h.filas);
      h.filas.forEach((fila, r) => fila.forEach((v, c) => {
        const ref = X.utils.encode_cell({ r, c });
        if (r > 0 && typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ws[ref] = { t: 'n', v: serialExcel(v), z: 'dd/mm/yyyy' };
        else if (r > 0 && typeof v === 'number' && Math.abs(v) >= 1000) ws[ref].z = '#,##0';
      }));
      ws['!cols'] = (h.filas[0] || []).map((_, c) => ({ wch: Math.min(45, Math.max(10, ...h.filas.slice(0, 200).map((f) => String(f[c] == null ? '' : f[c]).length + 2))) }));
      let n = String(h.nombre || 'Hoja').replace(/[\[\]:*?/\\]/g, ' ').slice(0, 28) || 'Hoja';
      while (usados[n.toLowerCase()]) n = n.slice(0, 26) + ' ' + (Object.keys(usados).length + 1);
      usados[n.toLowerCase()] = true;
      X.utils.book_append_sheet(wb, ws, n);
    });
    descargar(nombre.replace(/[\\/:*?"<>|]/g, '-') + '.xlsx', X.write(wb, { bookType: 'xlsx', type: 'base64' }));
    toast('Excel descargado: ' + nombre + '.xlsx');
  }

  const normEnc = (v) => String(v == null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim();
  const xFecha = (v) => {
    if (typeof v === 'number' && v > 59) return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
    const t = String(v == null ? '' : v).trim();
    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
    if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return t;
  };
  const xHora = (v) => {
    if (typeof v === 'number') { const min = Math.round((v % 1) * 1440) % 1440; return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`; }
    const m = String(v == null ? '' : v).trim().toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm|a m|p m)?$/);
    if (!m) return String(v == null ? '' : v).trim();
    let h = Number(m[1]); const ap = (m[3] || '').replace(' ', '');
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return `${String(h).padStart(2, '0')}:${m[2] || '00'}`;
  };
  const xNum = (v) => (typeof v === 'number' ? Math.round(v) : Number(String(v == null ? '' : v).replace(/[^\d-]/g, '')) || 0);
  const xTxt = (v) => String(v == null ? '' : v).trim();
  const xSi = (v) => v === true || /^(si|sí|s|x|1|true|verdadero)$/i.test(xTxt(v));

  /** Busca la fila de encabezados (en las primeras 10) y devuelve objetos con los campos del mapa. */
  function filasPorEncabezado(filas, mapa) {
    for (let r = 0; r < Math.min(10, filas.length); r++) {
      const enc = filas[r].map(normEnc), idx = {};
      Object.entries(mapa).forEach(([k, alias]) => { const i = enc.findIndex((h) => alias.includes(h)); if (i >= 0) idx[k] = i; });
      if (Object.keys(idx).length >= Math.min(2, Object.keys(mapa).length)) {
        return filas.slice(r + 1).map((f, j) => {
          const o = { fila: r + j + 2 };
          Object.entries(idx).forEach(([k, i]) => { o[k] = f[i]; });
          return o;
        }).filter((o) => Object.keys(o).some((k) => k !== 'fila' && xTxt(o[k]) !== ''));
      }
    }
    return null;
  }

  async function leerLibro(file) {
    const X = await cargarXlsx();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const hoja = (nombre) => X.utils.sheet_to_json(wb.Sheets[nombre || wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    return { nombres: wb.SheetNames, hoja };
  }

  /** Ventana genérica de importación: elegir archivo, ver cuántas filas se leyeron e importar. */

      <div class="form-actions">${o.extra || ''}<button type="button" class="btn ghost" id="xPlant">${ico('xls')} Descargar plantilla</button><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn gold" id="xOk" disabled>Importar</button></div>`);

    $('#xPlant', body).addEventListener('click', (ev) => ocupado(ev.currentTarget, () => o.plantilla()).catch(() => {}));

      }
      $('#xOk', body).disabled = !filas.length;
    });
    $('#xOk', body).addEventListener('click', async (ev) => {
      let r;
      try { r = await ocupado(ev.currentTarget, () => o.enviar(filas)); } catch (e) { return; }
      toast(r.mensaje);
      if (r.errores && r.errores.length) {
        $('#xOk', body).disabled = true;
        $('#xErr', body).innerHTML = `<div class="alert">${ico('alert')}<div><b>${r.mensaje}</b><br>No se importaron ${r.errores.length} fila(s):<br>${r.errores.slice(0, 20).map(esc).join('<br>')}${r.errores.length > 20 ? '<br>…' : ''}</div></div>`;
      } else cerrarModal();
      if (o.despues) o.despues();
    });
  }

  const exigir = (filas, encabezados) => {
    if (!filas) throw new Error('No se encontraron los encabezados en el archivo. La primera fila debe tener: ' + encabezados + '.');
    return filas;
  };
  const hoyArchivo = () => S.ini.hoy;

  // ── Por sección ──
  const ENC_MIEMBROS = ['Nombre', 'Sexo (M/F)', 'Fecha de nacimiento', 'Teléfono', 'Correo', 'Dirección', 'Estado', 'Edad'];
  const ENC_EVENTOS = ['Nombre del evento', 'Fecha', 'Hora de inicio', 'Hora de terminación', 'Lugar', 'Responsable', 'Descripción', 'Comité', 'Agendado por', 'Estado'];
  const encMovs = (ing) => ['Número', 'Fecha', 'Categoría', ing ? 'Recibido en' : 'Pagado con', 'Valor', 'Concepto', ...(ing ? [] : ['Pagado a', 'Documento / NIT']), 'Referencia Nequi', 'Estado', 'Registrado por'];

  async function filasEventos() {
    const evs = await api('listarEventos', {});
    return [ENC_EVENTOS, ...evs.map((e) => [e.titulo, e.fecha, e.hora_inicio, e.hora_fin, e.lugar, e.responsable, e.descripcion, e.comite || '', e.creado_por, e.estado])];
  }

  /** Informe semanal en un formato que se puede volver a importar (columna Clave). */
  function filasSemana() {
    const d = S.semDatos, c = calcSemana(d, S.sem.calculo.porcentajes, S.sem.billetes);
    const f = [['Clave (no modificar)', 'Sección', 'Concepto', 'Valor', 'Fecha', '¿Se realizó?', 'Promedio']];
    f.push(['semana', 'Semana', `Del ${fechaCorta(S.sem.lunes)} al ${fechaCorta(S.sem.domingo)}`, '', S.sem.domingo, '', '']);
    S.sem.billetes.forEach((b) => f.push([`conteo.${b}`, 'Conteo de billetes (cantidad)', 'Billetes de ' + pesos(b), Number(d.conteo[b]) || 0, '', '', '']));
    f.push(['conteo.monedas', 'Conteo de billetes', 'Monedas (valor)', Number(d.conteo.monedas) || 0, '', '', '']);
    f.push(['conteo.nequi', 'Conteo de billetes', 'Nequi (valor)', Number(d.conteo.nequi) || 0, '', '', '']);
    f.push(['diezmos.noche', 'Informe de diezmos', 'Noche', Number(d.diezmos.noche) || 0, '', '', '']);
    f.push(['diezmos.sobres', 'Informe de diezmos', 'Sobres', Number(d.diezmos.sobres) || 0, '', '', '']);
    d.cultos.forEach((x, i) => f.push([`cultos.${i}`, 'Cultos semanales', x.nombre || '', Number(x.ofrenda) || 0, x.fecha || '', x.realizado ? 'Sí' : 'No', x.promedio || '']));
    d.sectores.forEach((x, i) => f.push([`sectores.${i}`, 'Cultos en los sectores', x.nombre || '', Number(x.ofrenda) || 0, x.fecha || '', '', '']));
    d.egresos.forEach((x, i) => f.push([`egresos.${i}`, 'Egresos', x.detalle || '', Number(x.valor) || 0, '', '', '']));
    f.push(['observaciones', 'Observaciones', 'Observaciones', d.observaciones || '', '', '', '']);
    const p = c.porcentajes || S.sem.calculo.porcentajes;
    const r = [['Concepto', 'Valor'], ['Semana', `${fechaCorta(S.sem.lunes)} al ${fechaCorta(S.sem.domingo)}`], ['Estado', S.sem.estado],
      ['Diezmos del día (conteo)', c.dia.diezmos], ['Diezmos noche', c.noche.diezmos], ['Diezmos sobres', c.sobres.diezmos], ['Total diezmos', c.total.diezmos],
      [p[0] + '%', c.total.a1], [p[1] + '%', c.total.a2], [p[2] + '%', c.total.a3], ['Total suma de aportes', c.totalAportes], ['Neto diezmos', c.total.neto], ['Neto menos Nequi', c.netoMenosNequi],
      ['Subtotal ofrendas de cultos', c.subtotalOfrendas], ['(−) Egresos', c.totalEgresos], ['Total ofrendas', c.totalOfrendas], ['Cultos en sectores', c.totalSectores],
      ['TOTAL GENERAL', c.totalGeneral], ['Valor en letras', c.letras]];
    return [{ nombre: 'Informe', filas: f }, { nombre: 'Resumen', filas: r }];
  }

  function leerSemanaExcel(libro) {
    const nombre = libro.nombres.find((n) => normEnc(n) === 'informe') || libro.nombres[0];
    const filas = libro.hoja(nombre);
    const enc = (filas[0] || []).map(normEnc);
    const col = (alias) => enc.findIndex((h) => alias.includes(h));
    const k = col(['clave no modificar', 'clave']), val = col(['valor']), fec = col(['fecha']), rea = col(['se realizo']), pro = col(['promedio']), con = col(['concepto']);
    if (k < 0 || val < 0) throw new Error('Use el Excel descargado de esta sección: debe tener las columnas "Clave" y "Valor".');
    return filas.slice(1).filter((f) => xTxt(f[k])).map((f) => ({ clave: xTxt(f[k]), concepto: con >= 0 ? f[con] : '', valor: f[val], fecha: fec >= 0 ? f[fec] : '', realizado: rea >= 0 ? f[rea] : '', promedio: pro >= 0 ? f[pro] : '' }));
  }

  /** Convierte las filas del Excel en los campos del informe que cambiaron. */
  function cambiosSemana(filas, datos) {
    const cambios = {};
    const poner = (ruta, v) => { if (String(leerRuta(datos, ruta) == null ? '' : leerRuta(datos, ruta)) !== String(v)) cambios[ruta] = v; };
    let domingo = '';
    filas.forEach((f) => {
      const m = f.clave.match(/^(cultos|sectores|egresos)\.(\d+)$/);
      if (f.clave === 'semana') domingo = xFecha(f.fecha);
      else if (/^conteo\.|^diezmos\./.test(f.clave)) { if (leerRuta(datos, f.clave) !== undefined) poner(f.clave, xNum(f.valor)); }
      else if (f.clave === 'observaciones') poner('observaciones', xTxt(f.valor));
      else if (m && datos[m[1]][Number(m[2])]) {
        const i = Number(m[2]), base = `${m[1]}.${i}`, lista = datos[m[1]];
        if (m[1] === 'egresos') { poner(base + '.detalle', xTxt(f.concepto)); poner(base + '.valor', xNum(f.valor)); return; }
        if (i >= lista.length - 3) poner(base + '.nombre', xTxt(f.concepto));
        poner(base + '.ofrenda', xNum(f.valor));
        poner(base + '.fecha', xTxt(f.fecha) ? xFecha(f.fecha) : '');
        if (m[1] === 'cultos') { poner(base + '.realizado', xSi(f.realizado)); poner(base + '.promedio', xNum(f.promedio) || ''); }
      }
    });
    return { domingo, cambios };
  }

  const EXCEL = {
    semana: {
      exportar: () => bajarExcel(`Informe semanal ${S.sem.domingo}`, filasSemana()),
      puedeImportar: () => S.sem && S.sem.estado !== 'CERRADA' && puede('semana.editar'),
      importar: () => formImportarExcel({
        titulo: 'Importar informe semanal',
        ayuda: 'Descargue el Excel de la semana, llene la columna <b>Valor</b> (y Fecha, ¿Se realizó? y Promedio en los cultos) y súbalo aquí. No cambie la columna <b>Clave</b>.',
        nota: 'Solo se guardan los campos que cambiaron, así no se borra lo que otros ya ingresaron.',
        plantilla: () => bajarExcel(`Informe semanal ${S.sem.domingo}`, filasSemana()),
        leer: leerSemanaExcel,
        vista: (f) => [f.concepto || f.clave, typeof f.valor === 'number' ? pesos(f.valor) : f.valor],
        enviar: async (filas) => {
          let dom = S.sem.domingo, datos = S.semDatos;
          const sem = cambiosSemana(filas, datos);
          if (sem.domingo && domingoCliente(sem.domingo) !== S.sem.domingo) {
            dom = domingoCliente(sem.domingo);
            const otra = await api('obtenerSemana', { fecha: dom });
            if (otra.estado === 'CERRADA') throw new Error(`El archivo es de la semana del ${fechaCorta(otra.lunes)} al ${fechaCorta(otra.domingo)}, que ya está cerrada.`);
            datos = otra.datos;
          }
          const { cambios } = cambiosSemana(filas, datos);
          const n = Object.keys(cambios).length;
          if (!n) return { mensaje: 'El archivo no trae cambios para esta semana.' };
          S.semCambios = {};
          await api('guardarSemana', { domingo: dom, cambios });
          S.semFecha = dom;
          return { mensaje: `${n} campo(s) importados en la semana del ${fechaCorta(dom)}.` };
        },
        despues: () => vSemana(S.semFecha),
      }),
    },
    eventos: {
      exportar: async () => bajarExcel('Eventos ' + hoyArchivo(), [{ nombre: 'Eventos', filas: await filasEventos() }]),
      puedeImportar: () => puede('eventos.crear'),
      importar: () => formImportarExcel({
        titulo: 'Importar eventos desde Excel',
        ayuda: 'Columnas: <b>Nombre del evento</b>, <b>Fecha</b>, <b>Hora de inicio</b> y <b>Hora de terminación</b>; opcionales Lugar, Responsable y Descripción. Cada evento se revisa igual que uno nuevo: no se permiten cruces de horario ni fechas pasadas.',
        plantilla: async () => bajarExcel('Eventos ' + hoyArchivo(), [{ nombre: 'Eventos', filas: await filasEventos() }]),
        leer: (libro) => exigir(filasPorEncabezado(libro.hoja(), {
          titulo: ['nombre del evento', 'evento', 'nombre', 'titulo'], fecha: ['fecha'],
          hora_inicio: ['hora de inicio', 'hora inicio', 'inicio', 'desde'], hora_fin: ['hora de terminacion', 'hora de fin', 'hora fin', 'fin', 'hasta', 'terminacion'],
          lugar: ['lugar'], responsable: ['responsable'], descripcion: ['descripcion', 'detalle'], estado: ['estado'],
        }), 'Nombre del evento, Fecha, Hora de inicio, Hora de terminación').filter((f) => !/cancel/i.test(xTxt(f.estado)))
          .map((f) => ({ fila: f.fila, titulo: xTxt(f.titulo), fecha: xFecha(f.fecha), hora_inicio: xHora(f.hora_inicio), hora_fin: xHora(f.hora_fin), lugar: xTxt(f.lugar), responsable: xTxt(f.responsable), descripcion: xTxt(f.descripcion) })),
        vista: (f) => [f.titulo, f.fecha, `${f.hora_inicio} a ${f.hora_fin}`, f.lugar],
        enviar: async (filas) => {
          // Los eventos que ya están en la agenda (mismo nombre, fecha y hora) no se repiten.
          const ya = new Set((await api('listarEventos', {})).map((e) => normEnc(e.titulo) + '|' + e.fecha + '|' + e.hora_inicio));
          const nuevas = filas.filter((f) => !ya.has(normEnc(f.titulo) + '|' + f.fecha + '|' + f.hora_inicio));
          const r = nuevas.length ? await api('importarEventos', { filas: nuevas }) : { agregados: 0, errores: [] };
          const rep = filas.length - nuevas.length;
          return { errores: r.errores, mensaje: `${r.agregados} evento(s) agregado(s)${rep ? `, ${rep} ya estaban en la agenda` : ''}.` };
        },
        despues: () => vEventos(),

  /** Exporta las tablas que se ven en pantalla (sin columnas de botones). */
  function tablasVista() {
    const hojas = $$('#view table').map((t, i) => {
      const filas = $$('tr', t).map((tr) => $$('th,td', tr).map((cel) => {
        const inp = cel.querySelector('input:not([type=checkbox]),select');
        const v = (inp ? inp.value : (cel.innerText || cel.textContent)).split(/\n+/).map((x) => x.trim()).filter(Boolean).join(' · ').replace(/\s+/g, ' ').trim();
        return /^-?\$ ?[\d.]+$/.test(v) ? Number(v.replace(/[^\d-]/g, '')) : v;
      }));
      const enc = filas[0] || [];
      const cols = enc.map((h, c) => c).filter((c) => xTxt(enc[c]) !== '');
      const card = t.closest('.card');
      const titulo = (card && card.querySelector('.card-head h3') ? card.querySelector('.card-head h3').textContent : '') || ($('#pageTitle').textContent + (i ? ' ' + (i + 1) : ''));
      return { nombre: titulo, filas: filas.map((f) => cols.map((c) => (f[c] === undefined ? '' : f[c]))) };
    }).filter((h) => h.filas.length > 1);
    if (!hojas.length) throw new Error('No hay tablas para exportar en esta pantalla.');
    return hojas;
  }

  // ───────────────────────── Informe semanal (formato F JL 02) ─────────────────────────
  // Mismos cálculos que calcularSemana_() en Code.gs.
  function numeroALetras(n) {
    n = Math.floor(Math.abs(Number(n) || 0));
    if (n === 0) return 'CERO PESOS M/CTE';
    const U = ['', 'UNO', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIUNO', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
    const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
    const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
    const apo = (s) => s.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
    const cien = (x) => { if (!x) return ''; if (x === 100) return 'CIEN'; const c = Math.floor(x / 100), r = x % 100; return [C[c], r === 0 ? '' : r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '')].filter(Boolean).join(' '); };
    const mil = (x) => { const m = Math.floor(x / 1000), r = x % 1000; return [m === 0 ? '' : m === 1 ? 'MIL' : apo(cien(m)) + ' MIL', cien(r)].filter(Boolean).join(' '); };
    const mm = Math.floor(n / 1e6), resto = n % 1e6;
    let t = [mm === 0 ? '' : mm === 1 ? 'UN MILLÓN' : apo(mil(mm)) + ' MILLONES', apo(mil(resto))].filter(Boolean).join(' ');
    if (mm && !resto) t += ' DE';
    return t + (n === 1 ? ' PESO M/CTE' : ' PESOS M/CTE');
  }

  function calcSemana(d, porc, billetes) {
    const n = (v) => Math.round(Number(v) || 0);
    const bill = billetes.reduce((a, b) => a + b * n(d.conteo[b]), 0);
    const conteo = bill + n(d.conteo.monedas) + n(d.conteo.nequi);
    const fila = (v) => { const a1 = Math.round(v * porc[0] / 100), a2 = Math.round((v - a1) * porc[1] / 100), a3 = Math.round((v - a1 - a2) * porc[2] / 100); return { diezmos: v, a1, a2, a3, neto: v - a1 - a2 - a3 }; };
    const dia = fila(conteo), noche = fila(n(d.diezmos.noche)), sobres = fila(n(d.diezmos.sobres));
    const total = fila(dia.diezmos + noche.diezmos + sobres.diezmos);
    const subtotalOfrendas = d.cultos.reduce((a, c) => a + n(c.ofrenda), 0);
    const totalEgresos = d.egresos.reduce((a, e) => a + n(e.valor), 0);
    const totalSectores = d.sectores.reduce((a, s) => a + n(s.ofrenda), 0);
    const totalAportes = total.a1 + total.a2 + total.a3;
    const totalOfrendas = subtotalOfrendas - totalEgresos;
    const totalGeneral = totalAportes + totalOfrendas + totalSectores;
    return { billetes: bill, conteo, dia, noche, sobres, total, netoMenosNequi: total.neto - n(d.conteo.nequi), totalAportes, subtotalOfrendas, totalEgresos, totalOfrendas, totalSectores, totalGeneral, letras: numeroALetras(totalGeneral) };
  }

  function domingoCliente(f) {

    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  }

  function alCambiarSemana(ev) {
    const el = ev.target.closest('[data-ruta]');

    const r = el.dataset.ruta;
    const v = el.type === 'checkbox' ? el.checked

    S.semCambios[r] = v;
    $('#btnGuardarSem') && ($('#btnGuardarSem').disabled = false);
    $('#semPend').hidden = false;
    pintarCalculos();
  }

  function pintarCalculos() {
    const c = calcSemana(S.semDatos, S.sem.calculo.porcentajes, S.sem.billetes);
    S.sem.billetes.forEach((b) => { c['b' + b] = (Number(S.semDatos.conteo[b]) || 0) * b; });
    $$('[data-calc]').forEach((el) => {
      const v = leerRuta(c, el.dataset.calc);
      el.textContent = typeof v === 'number' ? pesos(v) : v;
      if (el.dataset.calc === 'totalGeneral') el.style.color = v < 0 ? 'var(--danger)' : '';

  function cambiarSemana(fecha) {

  async function guardarSemana(btn) {

  // ───────────────────────── Reportes ─────────────────────────
  function rango(tipo) {
    const [y, m] = S.ini.hoy.split('-').map(Number);
    const f = (a, b, c) => `${a}-${String(b).padStart(2, '0')}-${String(c).padStart(2, '0')}`;
    if (tipo === 'mesAnt') { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; return [f(py, pm, 1), f(py, pm, new Date(py, pm, 0).getDate())]; }
    if (tipo === 'anio') return [f(y, 1, 1), S.ini.hoy];
    return [inicioMes(), S.ini.hoy];
  }

  // ───────────────────────── Eventos globales ─────────────────────────
  document.addEventListener('click', (ev) => {
    const nav = ev.target.closest('[data-vista]');
    if (nav) {
      ev.preventDefault();
      if (S.vista === 'semana' && semPendiente() && !confirm('Hay cambios sin guardar en el informe semanal. ¿Salir sin guardarlos?')) return;
      S.semCambios = {};
      ir(nav.dataset.vista); return;
    }
    if (ev.target.closest('[data-close]') || ev.target.id === 'modal') { cerrarModal(); return; }
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'nuevoIngreso') formMovimiento('INGRESO');
    else if (a === 'nuevoEgreso') formMovimiento('EGRESO');
    else if (a === 'filtrar') ocupado(b, cargarMovs);
    else if (a === 'anular') anular(b.dataset.id, b.dataset.num);
    else if (a === 'verPdf') { ev.preventDefault(); verPdf(b.dataset.url, b); }
    else if (a === 'cambiarClave') { $('#userMenu').hidden = true; formClave(false); }
    else if (a === 'salir') { $('#userMenu').hidden = true; salir(); }
    else if (a === 'importarMiembros') formImportar();
    else if (a === 'excel') menuExcel();
    else if (a === 'verPromedio') {
      S.verProm = !S.verProm; guardado.set('ipuc_prom', S.verProm ? '1' : '');
      $('#tCultos').classList.toggle('sin-prom', !S.verProm); b.classList.toggle('on', S.verProm);
    }
    else if (a === 'editarLista') formLista(b.dataset.clave);
    else if (a === 'copiarEnlace') copiar(S.ini.urlAgenda, 'Enlace copiado.');
    else if (a === 'restablecerClave') restablecerClave(b.dataset.email, b);
    else if (a === 'pdfMov') abrirPdf('pdfMovimiento', { id: b.dataset.id }, b);
    else if (a === 'pdfDia') abrirPdf('pdfDiario', { fecha: S.fechaCaja || S.ini.hoy }, b);
    else if (a === 'pdfPeriodo') abrirPdf('pdfPeriodo', { desde: $('#rDesde').value, hasta: $('#rHasta').value }, b);
    else if (a === 'verResumen') verResumen();
    else if (a === 'traslado') formTraslado();
    else if (a === 'reabrir') {
      const motivo = prompt('Motivo de la reapertura:');
      if (motivo != null) ocupado(b, () => api('reabrirCaja', { id: b.dataset.id, motivo })).then(() => { toast('Caja reabierta.'); ir('caja'); });
    }
    else if (a === 'nuevoMiembro') formMiembro();
    else if (a === 'nuevoEvento') formEvento(null, b.dataset.fecha);
    else if (a === 'verEvento') verEvento(b.dataset.id);
    else if (a === 'mesEvt') { S.evMes = b.dataset.mes; vEventos(); }
    else if (a === 'editarMiembro') formMiembro(b.dataset.id);
    else if (a === 'nuevoUsuario') formUsuario();
    else if (a === 'editarUsuario') formUsuario(b.dataset.email);
    else if (a === 'guardarPpto') guardarPpto(b);
    else if (a === 'guardarSemana') guardarSemana(b);
    else if (a === 'cerrarSemana') formCerrarSemana();
    else if (a === 'pdfLiquidacion') {
      if (semPendiente()) toast('Se usa lo último guardado. Guarde primero para incluir sus cambios.', true);
      abrirPdf('pdfLiquidacion', { domingo: S.sem.domingo }, b).catch(() => {});
    }
    else if (a === 'pdfSemana') {
      if (semPendiente()) toast('Se descarga lo último guardado. Guarde primero para incluir sus cambios.', true);
      abrirPdf('pdfSemana', { domingo: S.sem.domingo }, b);
    }
    else if (a === 'semanaAnt' || a === 'semanaSig') {
      const [y, m, d] = S.sem.domingo.split('-').map(Number);
      const dt = new Date(y, m - 1, d + (a === 'semanaAnt' ? -7 : 7), 12);
      cambiarSemana(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
    }
    else if (a === 'irSemana') cambiarSemana(b.dataset.fecha);
    else if (a === 'reabrirSemana') {
      const motivo = prompt('Motivo para reabrir la semana (se anulan sus registros en contabilidad):');
      if (motivo != null) ocupado(b, () => api('reabrirSemana', { domingo: S.sem.domingo, motivo })).then(() => { toast('Semana reabierta.'); vSemana(S.sem.domingo); });
    }
    else if (a === 'renombrarCat') {
      const c = S.ini.categorias.find((x) => x.id === b.dataset.id);
      const nombre = prompt('Nuevo nombre para la categoría (el historial y el presupuesto se actualizan):', c.nombre);
      if (nombre && nombre.trim() && nombre.trim() !== c.nombre) {
        ocupado(b, () => api('guardarCategoria', { id: c.id, tipo: c.tipo, nombre: nombre.trim(), activa: c.activa }))
          .then((cats) => { S.ini.categorias = cats; pintarCategorias(); toast('Categoría renombrada.'); });
      }
    }
    else if (a === 'toggleCat') {
      const c = S.ini.categorias.find((x) => x.id === b.dataset.id);
      ocupado(b, () => api('guardarCategoria', { id: c.id, tipo: c.tipo, nombre: c.nombre, activa: c.activa === 'SI' ? 'NO' : 'SI' }))
        .then((cats) => { S.ini.categorias = cats; pintarCategorias(); });
    }
  });

  }

  // ───────────────────────── Arranque ─────────────────────────
  const fallo = (e) => { $('#splash').hidden = false; $('#splash').innerHTML = `<p style="max-width:420px;text-align:center">No se pudo iniciar: ${esc(e.message)}</p>`; };
  if (window.MODO === 'agenda') iniciarAgenda().catch(fallo);
  else {
    S.token = guardado.get('ipuc_t');
    (S.token ? arrancar() : mostrarLogin()).catch(fallo);
  }
})();
</script>
