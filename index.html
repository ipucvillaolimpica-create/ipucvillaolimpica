<style>
  :root { --azul: #00338D; --cyan: #009FDA; --dorado: #F0AB00; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Source Sans 3", Calibri, Arial, sans-serif; color: #1d2433;
    background: linear-gradient(160deg, #001f5c 0%, var(--azul) 55%, #0a58b8 100%); display: grid; place-items: center; padding: 16px; }
  .card { background: #fff; border-radius: 18px; width: min(440px, 100%); padding: 34px 28px 26px; text-align: center;
    box-shadow: 0 20px 50px rgba(0, 20, 60, .35); border-top: 5px solid var(--dorado); }
  .logo { width: 140px; height: 130px; margin: 0 auto 14px; display: grid; place-items: center; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  small { display: block; letter-spacing: 1.5px; font-size: 12px; color: #5b6475; text-transform: uppercase; }
  h1 { margin: 4px 0 2px; color: var(--azul); font-size: 26px; }
  .lema { color: var(--cyan); font-style: italic; margin: 0 0 22px; }
  .btn { display: block; text-decoration: none; font-weight: 700; font-size: 16px; padding: 13px 16px; border-radius: 12px; margin: 10px 0; }
  .b1 { background: var(--dorado); color: #1d2433; }
  .b2 { border: 1px solid #d6dbe4; color: var(--azul); }
  .btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .aviso { background: #fff7e0; border: 1px solid #f3d27a; border-radius: 10px; padding: 12px; text-align: left; font-size: 14px; }
  footer { margin-top: 18px; font-size: 13px; color: #5b6475; }
  footer a { color: var(--cyan); }
</style>
</head>
